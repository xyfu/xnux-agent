name: release

on:
  push:
    tags: ["v*"]
  # Manual release from the Actions tab (or the API): creates the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.9.0-pre1 (a '-' makes it a pre-release)"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write   # upload release assets
  id-token: write   # cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3

      - name: build (reproducible, static)
        run: make dist VERSION="${VERSION}" COMMIT="$(git rev-parse --short HEAD)"

      # The release manifest (spec v1.1 delta 12.6): every release with
      # notes in releases/notes, this one with its downloads. The server
      # reads it from releases/latest/download/manifest.json.
      - name: manifest
        env:
          XNUX_MANIFEST_KEY: ${{ secrets.XNUX_MANIFEST_KEY }}
        run: |
          go run ./scripts/manifest build -version "${VERSION}" -bin bin -out bin/manifest.json
          go run ./scripts/manifest sign -in bin/manifest.json

      - name: sign
        run: |
          cd bin
          for f in *; do
            case "$f" in *.sig|*.pem) continue ;; esac
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      - name: release notes
        run: sed "s/@VERSION@/${VERSION}/g" docs/release-notes.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: bin/*
